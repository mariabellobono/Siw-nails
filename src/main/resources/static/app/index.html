<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MC NAILS - App React</title>
<link rel="stylesheet" href="/app/app.css">
</head>
<body>
<div id="root">Caricamento...</div>

<!-- React e ReactDOM: le librerie, caricate da internet (nessuna installazione necessaria).
     Babel traduce il JSX (l'HTML dentro il JavaScript) in JavaScript normale direttamente nel browser. -->
<script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script crossorigin src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>

<!-- Il nostro codice. L'ordine conta: prima le chiamate all'API, poi i componenti, infine l'avvio. -->
<script src="/app/api.js"></script>
<script type="text/babel" data-presets="react" src="/app/components.jsx"></script>
<script type="text/babel" data-presets="react" src="/app/main.jsx"></script>
</body>
</html>
