<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Registrazione</title>
</head>
<body>
    <h1>Registrazione</h1>

    <form th:action="@{/register}" method="post">

        <div>
            <label>Nome <input type="text" th:field="${utente.nome}"></label>
            <span th:if="${#fields.hasErrors('${utente.nome}')}" th:errors="${utente.nome}">errore</span>
        </div>

        <div>
            <label>Cognome <input type="text" th:field="${utente.cognome}"></label>
            <span th:if="${#fields.hasErrors('${utente.cognome}')}" th:errors="${utente.cognome}">errore</span>
        </div>

        <div>
            <label>Email <input type="email" th:field="${utente.email}"></label>
            <span th:if="${#fields.hasErrors('${utente.email}')}" th:errors="${utente.email}">errore</span>
        </div>

        <div>
            <label>Username <input type="text" th:field="${credenziali.username}"></label>
            <span th:if="${#fields.hasErrors('${credenziali.username}')}" th:errors="${credenziali.username}">errore</span>
        </div>

        <div>
            <label>Password <input type="password" th:field="${credenziali.password}"></label>
            <span th:if="${#fields.hasErrors('${credenziali.password}')}" th:errors="${credenziali.password}">errore</span>
        </div>

        <button type="submit">Registrati</button>
    </form>

    <p>Hai già un account? <a href="/login">Accedi</a></p>
    <a href="/">Torna alla Home</a>
</body>
</html>
