<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <title>Recensione</title>
</head>
<body>
    <nav th:replace="~{fragments/navbar :: navbar}"></nav>
    <main>
    <h1 th:text="${recensione.id != null} ? 'Modifica la recensione' : 'Scrivi una recensione'">Recensione</h1>
    <p>Appuntamento: <span th:text="${appuntamento.offerta.trattamento.nome}">Trattamento</span>
       del <span th:text="${appuntamento.data}">data</span></p>

    <!-- Inserimento: invia a /recensioni/appuntamento/{id}; modifica (la recensione ha gia' un id): invia a /recensioni/{id} -->
    <form th:action="${recensione.id != null} ? @{/recensioni/{id}(id=${recensione.id})} : @{/recensioni/appuntamento/{aid}(aid=${appuntamento.id})}"
          th:object="${recensione}" method="post">

        <div>
            <label>Voto (da 1 a 5) <input type="number" min="1" max="5" th:field="*{voto}"></label>
            <span th:if="${#fields.hasErrors('voto')}" th:errors="*{voto}">errore</span>
        </div>

        <div>
            <label>Testo <textarea th:field="*{testo}" rows="5" cols="50"></textarea></label>
            <span th:if="${#fields.hasErrors('testo')}" th:errors="*{testo}">errore</span>
        </div>

        <button type="submit">Salva</button>
    </form>

    <p><a th:href="@{/appuntamenti/{id}(id=${appuntamento.id})}">Torna all'appuntamento</a></p>
</main>
</body>
</html>
