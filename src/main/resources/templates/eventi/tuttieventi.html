<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">  <!--DICHIARAZIONE PER UTILIZZARE THYMELEAF-->
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <title>Eventi</title>
</head>
<body>
    <nav th:replace="~{fragments/navbar :: navbar}"></nav>
    <main>
    <h1>Eventi</h1>
    <ul>
        <!-- ripete il <li> una volta per ogni evento della lista "eventi" (messa nel Model dal controller) -->
        <li class="con-immagine" th:each="evento : ${eventi}">
            <img class="simbolo" th:src="@{${evento.percorsoImmagine}}" alt="">
            <div>
                <a th:href="@{/eventi/{id}(id=${evento.id})}" th:text="${evento.nome}">Nome</a>
                - <span th:text="${evento.citta}">Citta</span>
                (dal <span th:text="${evento.dataInizio}">data</span> al <span th:text="${evento.dataFine}">data</span>)
            </div>
        </li>
    </ul>
    <a href="/">Home</a>
</main>
</body>
</html>
